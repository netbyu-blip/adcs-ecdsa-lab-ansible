---
- name: Cloner {{ inventory_hostname }} depuis {{ vm_template }} avec customisation Windows
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
    folder: "{{ vcenter_folder }}"
    datastore: "{{ vcenter_datastore }}"
    name: "{{ inventory_hostname }}"
    template: "{{ vm_template }}"
    state: poweredon
    hardware:
      num_cpus: "{{ vm_cpu }}"
      memory_mb: "{{ vm_memory_mb }}"
    networks:
      - name: "{{ lab_network.portgroup }}"
        type: static
        ip: "{{ ansible_host }}"
        netmask: "{{ lab_network.netmask }}"
        gateway: "{{ lab_network.gateway }}"
    customization:
      hostname: "{{ inventory_hostname }}"
      password: "{{ win_admin_password }}"
      autologon: true
      autologoncount: 2
      timezone: "{{ vm_timezone }}"
      orgname: LAB
      fullname: Administrator
    wait_for_customization: true
    wait_for_customization_timeout: 1500
    wait_for_ip_address: true
    wait_for_ip_address_timeout: 600
  delegate_to: localhost

- name: Attendre VMware Tools
  community.vmware.vmware_guest_tools_wait:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vcenter_datacenter }}"
    name: "{{ inventory_hostname }}"
    timeout: 600
  delegate_to: localhost

- name: Copier le script de bootstrap WinRM dans l'invité (via VMware Tools, sans réseau)
  community.vmware.vmware_guest_file_operation:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vcenter_datacenter }}"
    vm_id: "{{ inventory_hostname }}"
    vm_username: Administrator
    vm_password: "{{ win_admin_password }}"
    copy:
      src: "{{ role_path }}/files/winrm_bootstrap.ps1"
      dest: 'C:\Windows\Temp\winrm_bootstrap.ps1'
      overwrite: true
  delegate_to: localhost

- name: Exécuter le bootstrap WinRM HTTPS
  community.vmware.vmware_vm_shell:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vcenter_datacenter }}"
    vm_id: "{{ inventory_hostname }}"
    vm_username: Administrator
    vm_password: "{{ win_admin_password }}"
    vm_shell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    vm_shell_args: '-NonInteractive -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\winrm_bootstrap.ps1'
    wait_for_process: true
    timeout: 300
  delegate_to: localhost

- name: Attendre WinRM HTTPS (5986)
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 5986
    timeout: 600
  delegate_to: localhost

- name: Vérifier la connexion WinRM
  ansible.windows.win_ping:
